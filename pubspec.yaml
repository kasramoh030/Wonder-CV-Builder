name: cv_pro
description: "CV Pro — International CV & Resume Builder + AI Analyzer. Offline-first, country-aware, ATS-ready."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State, DI & Navigation ────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # ── Local persistence (the offline-first core) ────────────────────────────
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  crypto: ^3.0.7
  uuid: ^4.6.0
  json_annotation: ^4.12.0

  # ── Documents, PDF & analysis ─────────────────────────────────────────────
  pdf: ^3.12.0
  archive: ^3.6.1
  xml: ^6.6.1
  bidi: ^2.0.13

  # ── Native file, print and photo plumbing ─────────────────────────────────
  #   These are the only plugins in the project. Everything else — the
  #   database, the analyser, the PDF engine, the connectivity probe — is
  #   either pure Dart or implemented against the Flutter SDK directly, which
  #   is why the app needs no runtime permissions beyond storage access for
  #   the file the user explicitly exports.
  printing: any
  share_plus: any
  file_picker: any
  image_picker: any
  flutter_secure_storage: any

  # Optional online features resolve links out to the platform browser.
  url_launcher: any

  # ── Networking (strictly for optional online features) ────────────────────
  http: ^1.3.0

  # Pinned by the Flutter SDK — never constrain these ourselves.
  intl: any
  collection: any
  meta: any
  path: any
  characters: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/regional_rules/
    - assets/data/analyzer/
    - assets/data/templates/
    - assets/branding/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700

    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/vazirmatn/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/vazirmatn/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/vazirmatn/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/vazirmatn/Vazirmatn-Bold.ttf
          weight: 700

    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/lato/Lato-Italic.ttf
          weight: 400
          style: italic

    - family: Noto Sans
      fonts:
        - asset: assets/fonts/notosans/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/notosans/NotoSans-Bold.ttf
          weight: 700

    - family: Open Sans
      fonts:
        - asset: assets/fonts/opensans/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/opensans/OpenSans-Bold.ttf
          weight: 700
