name: Android debug

# An installable APK for every push, so a build break in the Android layer is
# caught in minutes rather than at release time. This workflow builds the
# debug flavour with the debug key on purpose — it is a smoke build, not a
# release. The signed, publishable artifact comes from android-release.yml.
#
# Analysis and tests are their own workflows (analyze.yml, test.yml) so a
# failure names the stage that failed; this one records its toolchain and
# Gradle output as a commit comment when a build fails, because the raw
# Actions log needs repository sign-in to read.

on:
  push:
    branches: ["arena/**", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        id: apk
        continue-on-error: true
        run: |
          set +e
          rm -f /tmp/android_codes.env
          flutter build apk --debug > /tmp/apk_debug.txt 2>&1
          echo "debug_code=$?" >> /tmp/android_codes.env
          tail -c 40000 /tmp/apk_debug.txt
          exit 0

      # Inspect what was actually built, on every push: identity, version,
      # target SDK, permissions, exported components, native ABIs and any
      # accidental key material. The debug key is expected here, so the script
      # is told not to fail on it — the release workflow checks that part for
      # real, with the release artifact.
      - name: Inspect the APK
        id: inspect
        if: steps.apk.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          bash tools/verify_release_artifact.sh --allow-debug-signature "$APK" > /tmp/inspect.txt 2>&1
          echo "inspect_code=$?" >> /tmp/android_codes.env
          cat /tmp/inspect.txt
          exit 0

      - name: Publish the inspection table
        if: always() && github.event_name == 'push' && hashFiles('/tmp/inspect.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          {
            echo "## APK inspection for ${GITHUB_SHA:0:7}"
            echo
            echo '```'
            cat /tmp/inspect.txt
            echo '```'
          } > /tmp/inspect_report.md
          payload=$(python3 -c 'import json; print(json.dumps({"body": open("/tmp/inspect_report.md").read()}))')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d "$payload" > /dev/null

      - name: Publish Android diagnostics as a commit comment
        if: always() && steps.apk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          debug_code=0
          if [ -f /tmp/android_codes.env ]; then
            # shellcheck disable=SC1091
            . /tmp/android_codes.env
          fi
          {
            echo "## Android debug build diagnostics for ${GITHUB_SHA:0:7}"
            echo
            echo "* flutter build apk --debug exit: ${debug_code}"
            echo
            echo "<details><summary>toolchain</summary>"
            echo
            echo '```'
            flutter --version || true
            java -version 2>&1 || true
            cat android/app/build.gradle.kts 2>/dev/null || true
            echo '```'
            echo "</details>"
            echo
            echo "<details open><summary>gradle output</summary>"
            echo
            echo '```'
            tail -c 50000 /tmp/apk_debug.txt || true
            echo '```'
            echo "</details>"
          } > /tmp/android_report.md
          payload=$(python3 -c 'import json; print(json.dumps({"body": open("/tmp/android_report.md").read()}))')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d "$payload" > /dev/null

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wonder-cv-builder-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Fail if the build or the inspection failed
        if: always()
        run: |
          if [ ! -f /tmp/android_codes.env ]; then
            echo "No result file was written; treating this as a failure."
            exit 1
          fi
          # shellcheck disable=SC1091
          . /tmp/android_codes.env
          echo "debug build exit: ${debug_code:-unset}"
          echo "apk inspection exit: ${inspect_code:-not run}"
          if [ "${debug_code:-1}" != "0" ]; then
            exit 1
          fi
          # A smoke build that produces an APK with the wrong package, an
          # unexpected permission or an exported component nobody meant to
          # export is a failure even though Gradle succeeded.
          if [ "${inspect_code:-1}" != "0" ]; then
            exit 1
          fi
