name: Android release

# Signed release APK and AAB.
#
# Triggered by a version tag (`v1.0.0`) or by hand. It needs four repository
# secrets; without them it fails immediately with a message naming the missing
# ones, because a pipeline that quietly falls back to the debug key produces an
# artifact that can never be published.
#
#   ANDROID_KEYSTORE_BASE64     base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD   the keystore's password
#   ANDROID_KEY_ALIAS           the key alias inside it
#   ANDROID_KEY_PASSWORD        that key's password
#
# The shorter names — KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and
# KEY_PASSWORD — are accepted too, because they are what most guides use, and
# requiring a rename before the first release is a pointless reason to be
# blocked. Either naming works; whatever is missing is named in the failure.
#
# See docs/RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Optional label for the run (defaults to the ref name)"
        required: false
  push:
    tags: ["v*"]

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # First, before a JDK, a Flutter SDK or any secret is touched: does the
      # repository carry key material or a credential? A release is the worst
      # possible moment to find out that it does, because that is when the
      # artifact becomes public.
      - name: Check for key material
        run: bash tools/check_no_key_material.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve the signing secrets
        id: signing
        env:
          KEYSTORE_LONG: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_SHORT: ${{ secrets.KEYSTORE_BASE64 }}
          PASSWORD_LONG: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASSWORD_SHORT: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_LONG: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALIAS_SHORT: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_LONG: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASSWORD_SHORT: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          keystore="${KEYSTORE_LONG:-$KEYSTORE_SHORT}"
          store_password="${PASSWORD_LONG:-$PASSWORD_SHORT}"
          alias="${ALIAS_LONG:-$ALIAS_SHORT}"
          key_password="${KEY_PASSWORD_LONG:-$KEY_PASSWORD_SHORT}"

          missing=""
          [ -n "$keystore" ]       || missing="$missing KEYSTORE_BASE64"
          [ -n "$store_password" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "$alias" ]          || missing="$missing KEY_ALIAS"
          [ -n "$key_password" ]   || missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing"
            echo "The release build refuses to run rather than produce an APK signed with the debug key."
            echo "Add them under Settings -> Secrets and variables -> Actions. See docs/RELEASE.md."
            exit 1
          fi

          # Handed to the later steps through the environment, not the log.
          # Every value originates in a secret, so Actions masks it wherever it
          # might otherwise appear.
          {
            echo "KEYSTORE_B64=$keystore"
            echo "STORE_PASSWORD=$store_password"
            echo "KEY_ALIAS=$alias"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
          echo "All four signing values are present."

      - name: Write the keystore
        run: |
          set -e
          # Written to the runner's tmp, never to the workspace, so it cannot
          # be picked up by an artifact upload or a stray git add.
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "keystore written ($(stat -c%s "$RUNNER_TEMP/upload-keystore.jks") bytes)"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          expected="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $expected"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pubspec version $version."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Collect artifacts under their release names
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/wonder-cv-builder-release.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/wonder-cv-builder-release.aab
          # R8 mapping, for reading a stack trace from a released build.
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt dist/mapping.txt
          fi
          ls -lh dist

      - name: Verify the build (signing, package, permissions, manifest)
        env:
          # Set once with:  gh variable set ANDROID_CERT_SHA256 --body '<hex>'
          # It is the certificate's SHA-256, which is public information; it is
          # what makes "signed with the release key" checkable rather than
          # merely "not the debug key".
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: bash tools/verify_release_artifact.sh dist/wonder-cv-builder-release.apk dist/wonder-cv-builder-release.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: wonder-cv-builder-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android release artifacts"
            echo '```'
            ls -lh dist || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
