name: Android release

# Signed release APK and AAB.
#
# Triggered by a version tag (`v1.0.0`) or by hand. It needs four repository
# secrets; without them it fails immediately with a message naming the missing
# ones, because a pipeline that quietly falls back to the debug key produces an
# artifact that can never be published.
#
#   ANDROID_KEYSTORE_BASE64     base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD   the keystore's password
#   ANDROID_KEY_ALIAS           the key alias inside it
#   ANDROID_KEY_PASSWORD        that key's password
#
# See docs/RELEASE.md.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Optional label for the run (defaults to the ref name)"
        required: false
  push:
    tags: ["v*"]

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check the signing secrets are present
        id: secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ]       || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing signing secret(s):$missing"
            echo "The release build refuses to run rather than produce an APK signed with the debug key."
            echo "Add them under Settings → Secrets and variables → Actions. See docs/RELEASE.md."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Write the keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          # Written to the runner's tmp, never to the workspace, so it cannot
          # be picked up by an artifact upload or a stray git add.
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "keystore written ($(stat -c%s "$RUNNER_TEMP/upload-keystore.jks") bytes)"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          expected="v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $expected"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pubspec version $version."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Collect artifacts under their release names
        run: |
          set -e
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/wonder-cv-builder-release.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/wonder-cv-builder-release.aab
          # R8 mapping, for reading a stack trace from a released build.
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt dist/mapping.txt
          fi
          ls -lh dist

      - name: Verify the build (signing, package, permissions, manifest)
        run: bash tools/verify_release_artifact.sh dist/wonder-cv-builder-release.apk dist/wonder-cv-builder-release.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wonder-cv-builder-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "### Android release artifacts"
            echo '```'
            ls -lh dist || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach to a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
