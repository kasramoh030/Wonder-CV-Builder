name: CI

on:
  push:
    branches: ["arena/**", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Report resolved versions
        if: always()
        run: |
          {
            echo "### Resolved dependency versions"
            echo '```'
            grep -E '^  [a-z_0-9]+:$' -A2 pubspec.lock | awk '/^  [a-z_0-9]+:$/{n=$1} /version:/{print n" "$2}' | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate code (drift, json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --fatal-warnings > /tmp/analyze.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/analyze.txt
          {
            echo "### flutter analyze --fatal-warnings (exit $code)"
            echo '```'
            tail -c 60000 /tmp/analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          flutter test --coverage --reporter expanded > /tmp/test.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/test.txt
          {
            echo "### flutter test (exit $code)"
            echo '```'
            tail -c 60000 /tmp/test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Reading the raw Actions log requires repository sign-in, and the
      # agent or a maintainer working from a shell cannot always reach the
      # log archive. Publishing the captured output as a commit comment makes
      # the build diagnostics readable through the ordinary contents API,
      # which is what both CI triage and the remote coding agent use.
      - name: Publish diagnostics as a commit comment
        if: steps.analyze.outputs.exit_code != '0' || steps.tests.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          analyze_code="${{ steps.analyze.outputs.exit_code }}"
          test_code="${{ steps.tests.outputs.exit_code }}"
          {
            echo "## CI diagnostics for ${GITHUB_SHA:0:7}"
            echo
            echo "* flutter analyze exit: ${analyze_code}"
            echo "* flutter test exit: ${test_code}"
            echo
            if [ "$analyze_code" != "0" ]; then
              echo "<details open><summary>flutter analyze</summary>"
              echo
              echo '```'
              head -c 24000 /tmp/analyze.txt || true
              echo '```'
              echo "</details>"
            fi
            if [ "$test_code" != "0" ]; then
              echo "<details open><summary>flutter test</summary>"
              echo
              echo '```'
              head -c 24000 /tmp/test.txt || true
              echo '```'
              echo "</details>"
            fi
          } > /tmp/report.md

          payload=$(python3 -c 'import json,sys; print(json.dumps({"body": open("/tmp/report.md").read()}))')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d "$payload" > /dev/null

      - name: Fail if analysis or tests failed
        if: steps.analyze.outputs.exit_code != '0' || steps.tests.outputs.exit_code != '0'
        run: |
          echo "analyze exit: ${{ steps.analyze.outputs.exit_code }}"
          echo "test exit: ${{ steps.tests.outputs.exit_code }}"
          exit 1

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (debug + release)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Artifact sizes
        run: |
          {
            echo "### Android artifacts"
            echo '```'
            ls -lh build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
