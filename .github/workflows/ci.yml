name: CI

on:
  push:
    branches: ["arena/**", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          dart --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Report resolved versions
        if: always()
        run: |
          {
            echo "### Resolved dependency versions"
            echo '```'
            grep -E '^  [a-z_0-9]+:$' -A2 pubspec.lock | awk '/^  [a-z_0-9]+:$/{n=$1} /version:/{print n" "$2}' | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate code (drift, json_serializable)
        id: codegen
        continue-on-error: true
        run: |
          set +e
          rm -f /tmp/codes.env
          dart run build_runner build --delete-conflicting-outputs > /tmp/gen.txt 2>&1
          code=$?
          echo "gen_code=$code" >> /tmp/codes.env
          tail -c 20000 /tmp/gen.txt
          {
            echo "### build_runner (exit $code)"
            echo '```'
            tail -c 40000 /tmp/gen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Static analysis
        id: analyze
        continue-on-error: true
        run: |
          set +e
          flutter analyze --fatal-warnings --no-fatal-infos > /tmp/analyze.txt 2>&1
          code=$?
          echo "analyze_code=$code" >> /tmp/codes.env
          cat /tmp/analyze.txt
          {
            echo "### flutter analyze --fatal-warnings --no-fatal-infos (exit $code)"
            echo '```'
            tail -c 60000 /tmp/analyze.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          flutter test --coverage --reporter expanded > /tmp/test.txt 2>&1
          code=$?
          echo "test_code=$code" >> /tmp/codes.env
          cat /tmp/test.txt
          {
            echo "### flutter test (exit $code)"
            echo '```'
            tail -c 60000 /tmp/test.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Reading the raw Actions log requires repository sign-in, and the
      # agent or a maintainer working from a shell cannot always reach the
      # log archive. Publishing the captured output as a commit comment makes
      # the build diagnostics readable through the ordinary contents API,
      # which is what both CI triage and the remote coding agent use.
      - name: Publish diagnostics as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gen_code=0
          analyze_code=0
          test_code=0
          if [ -f /tmp/codes.env ]; then
            # shellcheck disable=SC1091
            . /tmp/codes.env
          fi
          if [ "$gen_code" = "0" ] && [ "$analyze_code" = "0" ] && [ "$test_code" = "0" ]; then
            echo "All quality gates passed."
            exit 0
          fi
          {
            echo "## CI diagnostics for ${GITHUB_SHA:0:7}"
            echo
            echo "* build_runner exit: ${gen_code}"
            echo "* flutter analyze exit: ${analyze_code}"
            echo "* flutter test exit: ${test_code}"
            echo
            echo "<details><summary>resolved package versions</summary>"
            echo
            echo '```'
            awk '/^  [a-z_0-9]+:$/{pkg=$1} /^    version:/{if (pkg != "") print pkg" "$2; pkg=""}' pubspec.lock | head -200 || true
            echo '```'
            echo "</details>"
            echo
            if [ "$gen_code" != "0" ]; then
              echo "<details open><summary>build_runner</summary>"
              echo
              echo '```'
              tail -c 24000 /tmp/gen.txt || true
              echo '```'
              echo "</details>"
            fi
            if [ "$analyze_code" != "0" ]; then
              echo "<details open><summary>flutter analyze</summary>"
              echo
              echo '```'
              head -c 24000 /tmp/analyze.txt || true
              echo '```'
              echo "</details>"
            fi
            if [ "$test_code" != "0" ]; then
              echo "<details open><summary>flutter test</summary>"
              echo
              echo '```'
              head -c 24000 /tmp/test.txt || true
              echo '```'
              echo "</details>"
            fi
          } > /tmp/report.md

          payload=$(python3 -c 'import json,sys; print(json.dumps({"body": open("/tmp/report.md").read()}))')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d "$payload" > /dev/null

      - name: Fail if codegen, analysis or tests failed
        if: always()
        run: |
          if [ ! -f /tmp/codes.env ]; then
            echo "No result file was written; treating this as a failure."
            exit 1
          fi
          # shellcheck disable=SC1091
          . /tmp/codes.env
          echo "codegen exit: ${gen_code:-unset}"
          echo "analyze exit: ${analyze_code:-unset}"
          echo "test exit: ${test_code:-unset}"
          if [ "${gen_code:-1}" != "0" ] || [ "${analyze_code:-1}" != "0" ] || [ "${test_code:-1}" != "0" ]; then
            exit 1
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android (debug + release)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # The Gradle output is the only place an Android build failure explains
      # itself, and the raw Actions log needs repository sign-in to read. Each
      # build step therefore captures its own output, and the step below
      # publishes it as a commit comment when something fails — the same
      # channel the quality job uses.
      - name: Build debug APK
        id: apk_debug
        continue-on-error: true
        run: |
          set +e
          rm -f /tmp/android_codes.env
          flutter build apk --debug > /tmp/apk_debug.txt 2>&1
          echo "debug_code=$?" >> /tmp/android_codes.env
          tail -c 60000 /tmp/apk_debug.txt
          exit 0

      - name: Build release APK (split per ABI)
        id: apk_release
        continue-on-error: true
        run: |
          set +e
          flutter build apk --release --split-per-abi > /tmp/apk_release.txt 2>&1
          echo "release_code=$?" >> /tmp/android_codes.env
          tail -c 60000 /tmp/apk_release.txt
          exit 0

      - name: Build release AAB
        id: aab
        continue-on-error: true
        run: |
          set +e
          flutter build appbundle --release > /tmp/aab.txt 2>&1
          echo "aab_code=$?" >> /tmp/android_codes.env
          tail -c 60000 /tmp/aab.txt
          exit 0

      - name: Publish Android diagnostics as a commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          debug_code=0
          release_code=0
          aab_code=0
          if [ -f /tmp/android_codes.env ]; then
            # shellcheck disable=SC1091
            . /tmp/android_codes.env
          fi
          if [ "$debug_code" = "0" ] && [ "$release_code" = "0" ] && [ "$aab_code" = "0" ]; then
            echo "Android build passed."
            exit 0
          fi
          {
            echo "## Android diagnostics for ${GITHUB_SHA:0:7}"
            echo
            echo "* flutter build apk --debug exit: ${debug_code}"
            echo "* flutter build apk --release --split-per-abi exit: ${release_code}"
            echo "* flutter build appbundle --release exit: ${aab_code}"
            echo
            echo "<details><summary>toolchain</summary>"
            echo
            echo '```'
            flutter --version || true
            java -version 2>&1 || true
            cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null || true
            echo '```'
            echo "</details>"
            if [ "$debug_code" != "0" ]; then
              echo "<details open><summary>debug apk</summary>"
              echo
              echo '```'
              tail -c 50000 /tmp/apk_debug.txt || true
              echo '```'
              echo "</details>"
            fi
            if [ "$release_code" != "0" ]; then
              echo "<details open><summary>release apk</summary>"
              echo
              echo '```'
              tail -c 30000 /tmp/apk_release.txt || true
              echo '```'
              echo "</details>"
            fi
            if [ "$aab_code" != "0" ]; then
              echo "<details open><summary>app bundle</summary>"
              echo
              echo '```'
              tail -c 30000 /tmp/aab.txt || true
              echo '```'
              echo "</details>"
            fi
          } > /tmp/android_report.md

          payload=$(python3 -c 'import json,sys; print(json.dumps({"body": open("/tmp/android_report.md").read()}))')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -d "$payload" > /dev/null

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Artifact sizes
        if: always()
        run: |
          {
            echo "### Android artifacts"
            echo '```'
            ls -lh build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if a build failed
        if: always()
        run: |
          if [ ! -f /tmp/android_codes.env ]; then
            echo "No result file was written; treating this as a failure."
            exit 1
          fi
          # shellcheck disable=SC1091
          . /tmp/android_codes.env
          echo "debug exit: ${debug_code:-unset}"
          echo "release exit: ${release_code:-unset}"
          echo "aab exit: ${aab_code:-unset}"
          if [ "${debug_code:-1}" != "0" ] || [ "${release_code:-1}" != "0" ] || [ "${aab_code:-1}" != "0" ]; then
            exit 1
          fi
